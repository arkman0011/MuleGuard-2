# MuleGuard 2: first clean LoRA fine-tuning run

# Public Unsloth 4-bit checkpoint for Qwen2.5 1.5B Instruct.
model_name_or_path: unsloth/Qwen2.5-1.5B-Instruct-unsloth-bnb-4bit
template: qwen

# Supervised fine-tuning with a small LoRA adapter.
stage: sft
do_train: true
finetuning_type: lora

# RTX 4050 / 6 GB VRAM settings.
use_unsloth: true
quantization_bit: 4
quantization_method: bitsandbytes
bf16: true
upcast_layernorm: true

# Dataset registration folder and split selection.
dataset_dir: D:/MUEL GUARD LLM FT/data/llama_factory
dataset: muleguard_train
eval_dataset: muleguard_validation

# Each account profile is short, but keep room for the full record.
cutoff_len: 1024
preprocessing_num_workers: 1
dataloader_num_workers: 0

# Learn only the answer, MULE or NOT_MULE.
train_on_prompt: false
packing: false

# LoRA.
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
lora_target: all

# Training.
num_train_epochs: 3
learning_rate: 0.0001
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_steps: 10
max_grad_norm: 1.0
optim: adamw_8bit
seed: 42

# Validation during training.
eval_strategy: steps
eval_steps: 25
per_device_eval_batch_size: 1

# Checkpoints and logs.
output_dir: D:/MUEL GUARD LLM FT/models/run_clean
save_strategy: steps
save_steps: 25
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
logging_steps: 5
plot_loss: true
report_to: none
